name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tmdb
          POSTGRES_PASSWORD: tmdb
          POSTGRES_DB: tmdb_reminder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tmdb" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql+psycopg://tmdb:tmdb@localhost:5432/tmdb_reminder
      DATABASE_URL: postgresql+psycopg://tmdb:tmdb@localhost:5432/tmdb_reminder
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Type check (mypy)
        run: uv run mypy
      # Runs before the tests: the test fixtures call create_all against this
      # same database and leave the tables behind, which would collide with the
      # initial migration. This mirrors `just backend-test-full` (migrate-check
      # then tests) on a fresh database.
      - name: Migration upgrade + drift
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests
        run: uv run pytest -q
      - name: OpenAPI artifact drift
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code ../frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generated client drift
        run: |
          bun run gen:api
          git diff --exit-code src/api/schema.ts
      - name: ESLint
        run: bun run lint
      - name: Type check
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: node ./node_modules/vite/bin/vite.js build
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium chromium-headless-shell
      - name: End-to-end test
        run: bun run e2e

  # Build both application images. On pull requests: build only (no registry
  # login, push: false). On main and v* tags: publish to GHCR. `latest` moves
  # only on the default branch (is_default_branch); v* tags publish the exact
  # tag name. Published images also get sha-<short>.
  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        include:
          - image: tmdb-reminder-backend
            context: ./backend
            cache_scope: backend
          - image: tmdb-reminder-web
            context: ./frontend
            cache_scope: web
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: |
          docker compose config --quiet
          IMAGE_TAG=validation docker compose config --quiet
          IMAGE_TAG=validation docker compose config --images | grep -Fx "ghcr.io/dadav/tmdb-reminder-backend:validation"
          IMAGE_TAG=validation docker compose config --images | grep -Fx "ghcr.io/dadav/tmdb-reminder-web:validation"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dadav/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
