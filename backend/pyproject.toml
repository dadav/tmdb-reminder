[project]
name = "tmdb-reminder"
version = "1.0.0"
description = "Self-hosted TMDB release reminder with Gotify notifications"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "tmdbsimple>=2.9,<3.0",
    "httpx>=0.28,<1.0",
    "APScheduler>=3.11,<4.0",
    "anyio>=4.7,<5.0",
]

[project.scripts]
tmdb-reminder-api = "tmdb_reminder.main_api:main"
tmdb-reminder-worker = "tmdb_reminder.main_worker:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "anyio>=4.7,<5.0",
    "responses>=0.25,<1.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
    "asgi-lifespan>=2.1,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tmdb_reminder"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Alembic writes long, machine-generated DDL lines; don't lint those.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a live PostgreSQL (DATABASE_URL_TEST)",
]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["tmdb_reminder"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tmdbsimple.*", "apscheduler.*"]
ignore_missing_imports = true
