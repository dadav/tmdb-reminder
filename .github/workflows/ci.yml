name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tmdb
          POSTGRES_PASSWORD: tmdb
          POSTGRES_DB: tmdb_reminder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tmdb" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql+psycopg://tmdb:tmdb@localhost:5432/tmdb_reminder
      DATABASE_URL: postgresql+psycopg://tmdb:tmdb@localhost:5432/tmdb_reminder
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Type check (mypy)
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q
      - name: Migration upgrade + drift
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: OpenAPI artifact drift
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code ../frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generated client drift
        run: |
          bun run gen:api
          git diff --exit-code src/api/schema.ts
      - name: ESLint
        run: bun run lint
      - name: Type check
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: node ./node_modules/vite/bin/vite.js build
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium chromium-headless-shell
      - name: End-to-end test
        run: bun run e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
